<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Marketing Bot</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f4f6fb;height:100vh;display:flex;flex-direction:column}
  header{background:#4f46e5;color:#fff;padding:14px 20px;font-size:18px;font-weight:600}
  #chips{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:#fff;border:1px solid #c7d2fe;border-radius:16px;padding:6px 12px;cursor:pointer;font-size:13px}
  .chip:hover{background:#eef2ff}
  #log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:800px;padding:12px 14px;border-radius:12px;white-space:pre-wrap;line-height:1.5}
  .user{align-self:flex-end;background:#4f46e5;color:#fff}
  .bot{align-self:flex-start;background:#fff;border:1px solid #e5e7eb}
  form{display:flex;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #e5e7eb}
  textarea{flex:1;resize:none;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit}
  button{background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:0 20px;cursor:pointer;font-size:15px}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<header>📈 Digital Marketing Bot</header>
<div id="chips"></div>
<div id="log"><div class="msg bot">Hi! I can help with SEO, social posts, ad copy, email campaigns, content calendars and more. What are you promoting?</div></div>
<form id="f"><textarea id="t" rows="2" placeholder="Ask for a campaign, captions, ad copy…"></textarea><button id="b">Send</button></form>
<script>
const prompts=["Create a 7-day Instagram content calendar","Write 3 Google Ads headlines + descriptions","Draft a welcome email sequence","Give me 10 SEO blog topic ideas","Build a customer persona"];
const log=document.getElementById("log"),t=document.getElementById("t"),b=document.getElementById("b");
const history=[];
prompts.forEach(p=>{const c=document.createElement("span");c.className="chip";c.textContent=p;c.onclick=()=>{t.value=p;send()};document.getElementById("chips").append(c)});
function add(cls,text){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight;return d}
async function send(){
  const text=t.value.trim();if(!text||b.disabled)return;
  t.value="";add("user",text);history.push({role:"user",content:text});
  b.disabled=true;const w=add("bot","Thinking…");
  try{
    const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"The chat request failed");
    w.textContent=data.reply;history.push({role:"assistant",content:data.reply});
  }catch(e){w.textContent="Error: "+e.message;history.pop()}
  b.disabled=false;
}
document.getElementById("f").onsubmit=e=>{e.preventDefault();send()};
t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
</script>
</body>
</html>
